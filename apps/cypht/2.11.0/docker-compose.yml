services:
  cypht:
    image: cypht/cypht:2.11.0
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - TZ=${PANEL_APP_TIME_ZONE}
      - AUTH_USERNAME=${PANEL_AUTH_USERNAME}
      - AUTH_PASSWORD=${PANEL_AUTH_PASSWORD}
      - DB_DRIVER=sqlite
      - DB_CONNECTION_TYPE=host
      - DB_NAME=cypht
      - SESSION_TYPE=DB
      - USER_CONFIG_TYPE=DB
      - AUTH_TYPE=DB
      - DEFAULT_LANGUAGE=zh
      - DEFAULT_TIMEZONE=${PANEL_APP_TIME_ZONE}
    ports:
      - ${PANEL_APP_PORT_HTTP}:80
    volumes:
      - ./data:/var/lib/hm3
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true