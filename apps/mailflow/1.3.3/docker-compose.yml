services:
  frontend:
    image: ghcr.io/lanqiguoguo/mailflow-frontend:1.3.3
    container_name: ${CONTAINER_NAME}-frontend
    restart: unless-stopped
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    volumes:
      - ./certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - 1panel-network

  backend:
    image: ghcr.io/lanqiguoguo/mailflow-backend:1.3.3
    container_name: ${CONTAINER_NAME}-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${PANEL_SESSION_SECRET}
      APP_URL: ${PANEL_APP_URL}
      FRONTEND_URL: ${PANEL_APP_URL}
      DB_HOST: ${PANEL_DB_HOST}
      DB_NAME: ${PANEL_DB_NAME}
      DB_USER: ${PANEL_DB_USER}
      DB_PASSWORD: ${PANEL_DB_PASSWORD}
      REDIS_URL: redis://:${PANEL_REDIS_ROOT_PASSWORD}@${PANEL_REDIS_HOST}:6379
      GOOGLE_CLIENT_ID: ${PANEL_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${PANEL_GOOGLE_CLIENT_SECRET}
      ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${PANEL_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${PANEL_VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${PANEL_VAPID_SUBJECT}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true