services:
  portkey:
    image: portkeyai/gateway:1.15.2
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - TZ=${PANEL_APP_TIME_ZONE}
    ports:
      - ${PANEL_APP_PORT_HTTP}:8787
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true