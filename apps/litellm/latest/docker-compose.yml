services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${PANEL_APP_PORT_HTTP}:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
    environment:
      DATABASE_URL: "postgresql://${PANEL_DB_USER}:${PANEL_DB_PASSWORD}@${PANEL_DB_HOST}:5432/${PANEL_DB_NAME}"
      STORE_MODEL_IN_DB: ${PANEL_STORE_MODEL_IN_DB}
      LITELLM_MASTER_KEY: ${PANEL_MASTER_KEY}
      LITELLM_SALT_KEY: ${PANEL_SALT_KEY}
      REDIS_HOST: ${PANEL_REDIS_HOST}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${PANEL_REDIS_PASSWORD}
      TZ: ${TIME_ZONE}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
