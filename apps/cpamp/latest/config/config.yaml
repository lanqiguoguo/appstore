# 隐藏配置，可以记录每一个请求和响应，并保存到logs目录下
# 每条日志体积可能会高达10MB+，硬盘不够大请不要开启
request-log: false

# 隐藏配置，可以关闭重试时的间隔时间，根据需要进行设置
# 例如某模型触发429后，程序会暂时停用它，且每次再触发都会增加停用时间，最多延长到30分钟
# 默认情况下，停用期内会跳过该模型
# 设置true后，无论该模型是否处于停用期，仍会每次都向该模型发起请求，不再跳过
disable-cooling: false