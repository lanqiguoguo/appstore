services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.2.67
    container_name: ${CONTAINER_NAME}-cpa
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /CLIProxyAPI/data/config.yaml ]; then
          sed "s|__CPA_MANAGEMENT_KEY__|${PANEL_CPA_MANAGEMENT_KEY}|g" /CLIProxyAPI/config-template.yaml > /CLIProxyAPI/data/config.yaml
        fi
        exec ./CLIProxyAPI -config /CLIProxyAPI/data/config.yaml
    volumes:
      - ./config/config.yaml:/CLIProxyAPI/config-template.yaml:ro
      - ./cpa-data:/CLIProxyAPI/data
      - ./cpa-auths:/CLIProxyAPI/auths
      - ./cpa-logs:/CLIProxyAPI/logs
    ports:
      - ${PANEL_APP_PORT_API}:8317
    networks:
      - 1panel-network
    labels:
      createdBy: Apps

  cpa-manager-plus:
    image: seakee/cpa-manager-plus:1.10.5
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - HTTP_ADDR=0.0.0.0:18317
      - USAGE_DB_PATH=/data/usage.sqlite
      - CPA_MANAGER_DATA_KEY_PATH=/data/data.key
      - CPA_MANAGER_ADMIN_KEY=${PANEL_CPAMP_ADMIN_KEY}
      - USAGE_COLLECTOR_MODE=auto
      - USAGE_BATCH_SIZE=100
      - USAGE_POLL_INTERVAL_MS=500
      - USAGE_QUERY_LIMIT=50000
    ports:
      - ${PANEL_APP_PORT_HTTP}:18317
    volumes:
      - ./data:/data
    networks:
      - 1panel-network
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true