version: '3.5'
services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=${PANEL_APP_PORT_HTTP}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_STYLE=pretty
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
    volumes:
      - ./data:/app/data
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true
