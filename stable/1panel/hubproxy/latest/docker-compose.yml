services:
  hubproxy:
    image: ghcr.io/sky22333/hubproxy
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - ${PANEL_APP_PORT_HTTP}:5000
    volumes:
      - ./conf/config.toml:/root/config.toml
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true