services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.4.2
    container_name: ${CONTAINER_NAME}
    hostname: ${HOSTNAME}
    # hostname: yourhostname <- optional
    # default_port <- 2053
    # default_username <- admin
    # default_password <- admin
    volumes:
      - ./db/:/etc/x-ui/
      - ./cert/:/root/cert/
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=false
      - TZ=${TIME_ZONE}
    tty: true
    restart: unless-stopped
    network_mode: host
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        /app/x-ui setting -port ${PANEL_APP_PORT_HTTP}
        /app/x-ui setting -webBasePath "${PANEL_WEB_BASE_PATH}"
        /app/x-ui setting -username "${PANEL_USERNAME}" -password "${PANEL_PASSWORD}"
        exec /app/DockerEntrypoint.sh
    labels:
      createdBy: "Apps"