services:
  # CCX API 代理服务 (一体化架构: 后端 + 前端界面)
  ccx:
    image: crpi-i19l8zl0ugidq97v.cn-hangzhou.personal.cr.aliyuncs.com/bene/ccx:latest
    container_name: ${CONTAINER_NAME}
    ports:
      # 统一端口：前端界面 + API + 管理接口
      - '${PANEL_APP_PORT_HTTP}:3000'
    volumes:
      # 配置目录持久化
      - ./.config:/app/.config
      # 可选：日志持久化
      - ./logs:/app/logs
    environment:
      # 基础配置
      - ENV=production
      # 是否启用Web管理界面 (true=一体化模式, false=纯API模式)
      - ENABLE_WEB_UI=true
      # 代理访问密钥 - 用于验证客户端对代理服务器的访问权限
      - PROXY_ACCESS_KEY=${PANEL_PROXY_ACCESS_KEY}
      # 管理 API 独立密钥（可选，未设置时回退到 PROXY_ACCESS_KEY）
      # 设置后，Web 管理界面和 /api/* 端点将使用此密钥认证，与代理密钥隔离
      # - ADMIN_ACCESS_KEY=your-admin-secret-key
      # 日志级别 (error, warn, info, debug)
      - LOG_LEVEL=warn
      # 是否启用请求日志
      - ENABLE_REQUEST_LOGS=true
      # 是否启用响应日志
      - ENABLE_RESPONSE_LOGS=false
    # 健康检查配置
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 重启策略
    restart: unless-stopped
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
# 网络配置（可选，使用默认bridge网络）
networks:
  1panel-network:
    external: true