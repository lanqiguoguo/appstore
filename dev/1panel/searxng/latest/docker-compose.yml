services:
  searxng:
    container_name: ${CONTAINER_NAME}
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      - SEARXNG_BASE_URL=${PANEL_SEARXNG_BASE_URL}
      - SEARXNG_SECRET=${PANEL_SEARXNG_SECRET_KEY}
      - SEARXNG_CENTER_ALIGNMENT=true
      - SEARXNG_RESULTS_ON_NEW_TAB=true
      - SEARXNG_VALKEY_URL=valkey://${CONTAINER_NAME}-valkey:${PANEL_VALKEY_PORT}/0
    volumes:
      - ./config/:/etc/searxng/:Z
      - ./data:/var/cache/searxng/
    labels:
      createdBy: Apps
    networks:
      - 1panel-network

  valkey:
    container_name: ${CONTAINER_NAME}-valkey
    image: docker.io/valkey/valkey:9-alpine
    ports:
      - "${PANEL_VALKEY_PORT}:6379"
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - ./valkey:/data/
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true