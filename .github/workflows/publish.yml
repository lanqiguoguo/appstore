name: Sync Upstream & Publish AppStore

on:
  push:
    branches: [main]
    paths:
      - 'custom/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # merge 上游需要本地历史中存在共同祖先
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Sync upstream appstore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/1Panel-dev/appstore.git
          git fetch upstream dev
          git merge upstream/dev --no-edit

      - name: Build protocol artifacts
        run: python3 tools/build.py

      # dev/ 与 stable/ 双渠道由 build.py 一并生成：各渠道索引内的
      # icon/downloadUrl 绝对 URL 指向自身目录，稳定面板（init.yaml
      # mode=stable，按 {app_repo}/stable/... 取数）不再引用 dev/

      # 全部产物（含版本包）随仓库提交，由 raw 单域名直出；
      # GITHUB_TOKEN 的推送不会再触发工作流，提交另带 [skip ci] 双保险防循环
      - name: Commit and push
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "sync: upstream + regenerate dev/ stable/ [skip ci]" && git push origin main)
