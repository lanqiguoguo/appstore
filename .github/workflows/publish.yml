name: Build & Publish AppStore

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'tools/**'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      # 全部产物（含版本包）随 dev/ 提交进仓库，由 raw 单域名直出；
      # 回推提交不匹配上面的 paths 过滤，且带 [skip ci]，不会触发循环构建
      - name: Build protocol artifacts
        run: python3 tools/build.py

      - name: Commit dev/ back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/
          git diff --cached --quiet || (git commit -m "build: regenerate dev/ [skip ci]" && git push origin main)
